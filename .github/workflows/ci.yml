name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  format-check:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          # Pinned to the major version the tree is formatted with; formatting output differs across majors.
          sudo apt-get install -y clang-format-19

      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-19 --dry-run --Werror

  build-and-test-clang:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Clang 19 is the first version that can compile munch's tokenizer, which matisse builds against.
          sudo apt-get install -y clang-19 ninja-build

      - name: Check Clang version
        run: clang++-19 --version

      - name: Configure build with CMake
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ctest --output-on-failure

  build-and-test-strict:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Check GCC version
        run: g++ --version

      - name: Configure build with CMake
        env:
          CC: gcc
          CXX: g++
        # CMake compiles C++23 as gnu++23 unless extensions are off, and the GNU dialect accepts code the standard
        # does not, so this build holds every target to strict C++23 with warnings as errors.
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_EXTENSIONS=OFF -DMATISSE_WERROR=ON

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ctest --output-on-failure

  build-and-test-arm:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure build with CMake
        # Plain char is unsigned here, the opposite of the x86-64 jobs; token bytes and class symbols are read through
        # munch's carrier convention and nothing may depend on the carrier's signedness.
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ctest --output-on-failure

  sanitize:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Address and undefined-behavior sanitizers watch the tables and the merge loops; the thread sanitizer
          # watches the parallel encoder.
          - name: address-undefined
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all
          - name: thread
            flags: -fsanitize=thread

    name: sanitize (${{ matrix.name }})

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 ninja-build

      - name: Configure build with CMake
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ctest --output-on-failure

  build-and-test:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Print OS details
        run: |
          uname -a
          lsb_release -a

      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr ninja-build

      - name: Check GCC and gcovr version
        run: |
          g++ --version
          gcov --version
          gcovr --version

      - name: Restore the pinned vocabulary files
        # The four public files the tests pin are kept in the Actions cache under their digests, so the vendors' hosts
        # are read on the first run and after the cache expires, and never on a hit.
        id: vocab
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vocab
          key: vocab-196139668be63f3b-1ce1664773c50f3e-223921b76ee99bde-446a9538cb6c348e

      - name: Fetch the pinned vocabulary files
        # The four public files the tests pin, under the names the tests expect, each held to the SHA-256 the tests
        # hold it to, so that the loaders', the encoders' and the CLI's real-vocabulary tests run in the measured
        # build. Llama 3's tokenizer.model is gated behind its vendor's license and is not fetched; its tests skip.
        if: steps.vocab.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vocab"
          cd "$RUNNER_TEMP/vocab"
          curl -sSfL -o gpt2-vocab.json https://openaipublic.blob.core.windows.net/gpt-2/encodings/main/encoder.json
          curl -sSfL -o gpt2-merges.txt https://openaipublic.blob.core.windows.net/gpt-2/encodings/main/vocab.bpe
          curl -sSfL -o cl100k_base.tiktoken https://openaipublic.blob.core.windows.net/encodings/cl100k_base.tiktoken
          curl -sSfL -o o200k_base.tiktoken https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken
          echo "196139668be63f3b5d6574427317ae82f612a97c5d1cdaf36ed2256dbf636783  gpt2-vocab.json" | sha256sum -c -
          echo "1ce1664773c50f3e0cc8842619a93edc4624525b728b188a9e0be33b7726adc5  gpt2-merges.txt" | sha256sum -c -
          echo "223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7  cl100k_base.tiktoken" | sha256sum -c -
          echo "446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  o200k_base.tiktoken" | sha256sum -c -

      - name: Configure build with CMake
        # -fprofile-update=atomic: the parallel encoder runs on several threads, and gcov's counters are not atomic
        # by default.
        env:
          CC: gcc
          CXX: g++
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="--coverage -fprofile-abs-path -fprofile-update=atomic" \
                -DMATISSE_VOCAB_DIR="$RUNNER_TEMP/vocab"

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ctest --output-on-failure

      - name: Generate code coverage report
        run: |
          cd build

          # Each pattern is unanchored on both ends: gcovr matches --exclude against a path that may or may not
          # have a leading directory component, so a pattern requiring a literal leading "/" silently fails to
          # match the no-prefix case.
          EXCLUDES=(
            --exclude '(.*/)?external/.*'
            --exclude '(.*/)?_deps/.*'
            --exclude '(.*/)?tests/.*'
            --exclude '(.*/)?CMakeFiles/.*'
          )

          gcovr --root .. --gcov-executable gcov --xml-pretty --output coverage.xml "${EXCLUDES[@]}"
          gcovr --root .. --gcov-executable gcov --html --html-details --output coverage.html "${EXCLUDES[@]}"
          gcovr --root .. --gcov-executable gcov --txt-metric branch --print-summary "${EXCLUDES[@]}"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.xml
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  install-consumer:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install munch from the submodule
        run: |
          cmake -G Ninja -S external/munch -B build-munch -DCMAKE_BUILD_TYPE=Release \
                -DMUNCH_BUILD_TESTS=OFF -DMUNCH_BUILD_BENCHMARK=OFF -DMUNCH_INSTALL=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build-munch
          cmake --install build-munch

      - name: Install matisse against it
        run: |
          cmake -G Ninja -S . -B build-matisse -DCMAKE_BUILD_TYPE=Release \
                -DMATISSE_SYSTEM_MUNCH=ON -DMATISSE_INSTALL=ON -DMATISSE_BUILD_TESTS=OFF \
                -DCMAKE_PREFIX_PATH="$PWD/prefix" -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build-matisse
          cmake --install build-matisse

      - name: Build a consumer with find_package
        # The consumer knows nothing of either tree: it finds matisse by its package config, which finds munch by its
        # own.
        run: |
          mkdir consumer
          cat > consumer/CMakeLists.txt << 'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          find_package(matisse REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE matisse::matisse)
          CMAKE
          cat > consumer/main.cpp << 'CPP'
          #include <cstdio>
          #include <matisse/cl100k/tokenizer.hpp>
          #include <matisse/encode/encoder.hpp>
          #include <matisse/encode/stream_encoder.hpp>
          #include <matisse/gpt2/tokenizer.hpp>
          #include <matisse/llama3/tokenizer.hpp>
          #include <matisse/load/definition.hpp>
          #include <matisse/lookup/tokenizers.hpp>
          #include <matisse/o200k/tokenizer.hpp>
          #include <matisse/pretok/segmenter.hpp>
          #include <matisse/validate/report.hpp>
          int main()
          {
              std::printf("matisse found and linked\n");
              return 0;
          }
          CPP
          cmake -G Ninja -S consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build build-consumer
          ./build-consumer/consumer

      - name: Build a consumer of one tokenizer with find_package
        # A consumer of one tokenizer links its library alone and gets the stages it needs through it.
        run: |
          mkdir consumer-cl100k
          cat > consumer-cl100k/CMakeLists.txt << 'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(consumer_cl100k LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          find_package(matisse REQUIRED)
          add_executable(consumer_cl100k main.cpp)
          target_link_libraries(consumer_cl100k PRIVATE matisse::cl100k)
          CMAKE
          cat > consumer-cl100k/main.cpp << 'CPP'
          #include <cstdio>
          #include <matisse/cl100k/tokenizer.hpp>
          #include <matisse/pretok/segmenter.hpp>
          int main()
          {
              const matisse::pretok::Segmenter segmenter{matisse::cl100k::pattern()};
              const auto pieces{segmenter.boundaries("tiktoken is great!").size()};
              std::printf("matisse::cl100k found and linked, %zu pieces\n", pieces);
              return pieces == 4 ? 0 : 1;
          }
          CPP
          cmake -G Ninja -S consumer-cl100k -B build-consumer-cl100k -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build build-consumer-cl100k
          ./build-consumer-cl100k/consumer_cl100k
