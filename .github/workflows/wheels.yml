name: Wheels

# Builds and tests matisse-tokenizer's wheels and its sdist, and keeps them as the run's artifacts; publishing them is
# a step of its own, not taken here. It runs when started by hand and on a tag of the Python package's version.
on:
  workflow_dispatch:
  push:
    tags: [ "python-v*" ]

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64 and ARM64 in manylinux containers, and macOS on ARM64 and x86-64 with Homebrew's LLVM, as
        # pyproject.toml configures them. Windows has no job: matisse builds with GCC and Clang on Linux alone.
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel ]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Each wheel's tests fetch the public rank files from tiktoken's URLs, held to their digests.
      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v4.3.5

      - name: Keep the wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The sdist carries the munch submodule, which a build from it needs.
      - name: Build the sdist
        run: |
          python -m pip install build==1.6.1
          python -m build --sdist

      - name: Keep the sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
