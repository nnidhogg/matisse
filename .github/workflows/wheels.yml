name: Wheels

# Builds and tests matisse-tokenizer's wheels and its sdist, and keeps them as the run's artifacts. It runs when started
# by hand and on a tag of the Python package's version, and only a tag's run publishes them, to PyPI.
on:
  workflow_dispatch:
  push:
    tags: [ "python-v*" ]

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64 and ARM64 in manylinux containers, as pyproject.toml configures them. macOS has no job: libc++
        # has no std::views::cartesian_product in any release through LLVM 23.1.6 or on its main branch, and
        # libs/encode/src/verifier_table.cpp and libs/validate/src/report.cpp use it, so the macOS wheels wait for
        # libc++ to ship it. Windows has no job: matisse builds with GCC and Clang on Linux alone.
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Each wheel's tests fetch the public rank files from tiktoken's URLs, held to their digests.
      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v4.3.5

      - name: Keep the wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The sdist carries the munch submodule, which a build from it needs.
      - name: Build the sdist
        run: |
          python -m pip install build==1.6.1
          python -m build --sdist

      - name: Keep the sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # PyPI's trusted publishing for the project matisse-tokenizer, after every wheel and the sdist, so a failed leg
  # publishes nothing.
  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v')
    needs: [ wheels, sdist ]
    runs-on: ubuntu-24.04

    environment:
      name: pypi
      url: https://pypi.org/p/matisse-tokenizer

    permissions:
      id-token: write

    steps:
      - name: Fetch the wheels and the sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
