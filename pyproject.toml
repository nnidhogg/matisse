# The Python package, matisse-tokenizer, imported as matisse_tokenizer. It sits at the root because its extension
# module builds from the root CMake project's libraries and the munch submodule, which an sdist must carry whole; the
# package's own sources, the module's C++ and the tests are under python/. docs/python.md describes it.

[build-system]
requires = ["scikit-build-core==1.1.2", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "matisse-tokenizer"
# The version is read from python/matisse_tokenizer/__init__.py, its one source, by the regex provider below.
dynamic = ["version"]
description = """A tiktoken-compatible tokenizer that encodes in parallel and as a stream, with ids identical to \
  tiktoken's, for GPT-2, cl100k, o200k and Llama 3"""
readme = "docs/python.md"
requires-python = ">=3.12"
license = "MIT AND BSD-3-Clause AND Unicode-3.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Nicklas Nidhögg" }]
keywords = ["tokenization", "byte-pair encoding", "pre-tokenization", "parallel encoding", "C++"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# encode_to_numpy(), encode_batch_to_numpy() and encode_parallel_to_numpy() return NumPy arrays; nothing else needs
# NumPy.
numpy = ["numpy>=2"]

[project.urls]
Homepage = "https://github.com/nnidhogg/matisse"
Documentation = "https://github.com/nnidhogg/matisse/blob/master/docs/python.md"
Source = "https://github.com/nnidhogg/matisse"

[dependency-groups]
test = ["pytest==9.2.0", "tiktoken==0.14.0", "numpy==2.5.4", "tokenizers==0.23.3"]
bench = ["tiktoken==0.14.0", "numpy==2.5.4", "tokenizers==0.23.3"]

[tool.scikit-build]
minimum-version = "build-system.requires"
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "python/matisse_tokenizer/__init__.py"
build-dir = "build/python/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["python/matisse_tokenizer"]
# One wheel per platform under the stable ABI of Python 3.12, which every later CPython loads.
wheel.py-api = "cp312"
# The sdist leaves out what no build reads: munch's reports and their data, licensed apart from the code, and hopper's
# own munch submodule, since the build links hopper's libraries against matisse's munch.
sdist.exclude = ["build", ".github", "tools/fuzz/seeds", "external/munch/paper", "external/hopper/external/munch"]

[tool.scikit-build.cmake.define]
MATISSE_BUILD_PYTHON = "ON"
MATISSE_BUILD_TESTS = "OFF"
MATISSE_WERROR = "OFF"

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
build-frontend = "build"
# The newest manylinux images; matisse needs GCC 13 or later, as its README says.
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
test-groups = ["test"]
test-sources = [
    "python/tests",
    "libs/load/tests/data",
    "tools/unicode/check_tiktoken.py",
    "libs/gpt2/src/class_ranges.inc",
    "libs/cl100k/src/class_ranges.inc",
    "libs/o200k/src/class_ranges.inc",
    "libs/llama3/src/class_ranges.inc",
]
# The tests fetch the three public rank files from tiktoken's URLs; Llama 3's is gated by its vendor and skipped.
test-environment = { MATISSE_TEST_DOWNLOAD = "1" }
test-command = "python -m pytest python/tests"

[tool.cibuildwheel.linux]
archs = ["native"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
